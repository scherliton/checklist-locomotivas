<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checklist Pós-Drenagem</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fa;
margin:0;
padding:20px
}

.card{
max-width:500px;
margin:auto;
background:white;
border-radius:15px;
padding:20px;
box-shadow:0 4px 15px rgba(0,0,0,0.1)
}

h1{
text-align:center;
color:#003366
}

h2{
color:#003366
}

label{
display:block;
margin-top:15px;
font-weight:bold
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box
}

.item{
margin-top:15px;
padding:10px;
background:#f0f4f8;
border-radius:8px
}

.botoes{
display:flex;
gap:10px;
margin-top:10px
}

button{
flex:1;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer
}

.conf{
background:#2e8b57;
color:white;
}

.nao{
background:#c0392b;
color:white;
}

.selecionado{
outline:4px solid #003366;
}

.salvar{
width:100%;
margin-top:20px;
background:#003366;
color:white;
font-size:16px
}

.status{
margin-top:20px;
padding:15px;
border-radius:10px;
text-align:center;
font-weight:bold;
background:#d4edda;
color:#155724;
}

#mensagem{
margin-top:15px;
text-align:center;
font-weight:bold;
}
</style>

</head>

<body>

<div class="card">

<h1>🚂 Checklist Pós-Drenagem</h1>

<label>Locomotiva</label>
<input id="locomotiva" placeholder="Ex: 1304">


<label>Colaborador</label>
<input id="colaborador">

<button onclick="trocarColaborador()" style="margin-top:10px;background:#777;color:white">
Trocar colaborador
</button>


<h2>Itens de Verificação</h2>


<div id="lista"></div>


<div class="status" id="status">
🟢 CONFORME
</div>


<label>Observações</label>
<textarea id="observacao"></textarea>


<button class="salvar" onclick="enviarChecklist()">
💾 SALVAR CHECKLIST
</button>


<div id="mensagem"></div>

</div>


<script>

const URL_SCRIPT="https://script.google.com/macros/s/AKfycbyN9dkyn9OqQHC3fHKD8mdKtxcyr81Cc4_OtGwfPbWfk_03uFPT0MQVBko-9DbP1F-gBw/exec";


let itens=[
["BanheiroLimpo","🚿 Banheiro limpo"],
["BanheiroDrenado","🚽 Banheiro drenado"],
["AguaDisponivel","💧 Água disponível"],
["SaboneteLiquido","🧴 Sabonete líquido"],
["PapelHigienico","🧻 Papel higiênico"],
["PapelToalha","🧻 Papel toalha"],
["Iluminacao","💡 Iluminação"],
["PortaFuncionando","🚪 Porta funcionando"],
["CabineLimpa","🧹 Cabine limpa e organizada"]
];


let respostas={};


function carregar(){

let html="";

itens.forEach(i=>{

html+=`

<div class="item">

<label>${i[1]}</label>

<div class="botoes">

<button class="conf" onclick="marcar('${i[0]}','CONFORME',this)">
● CONFORME
</button>

<button class="nao" onclick="marcar('${i[0]}','NÃO CONFORME',this)">
● NÃO CONFORME
</button>

</div>

</div>

`;

});

document.getElementById("lista").innerHTML=html;

}


function marcar(campo,valor,botao){

respostas[campo]=valor;

let botoes=botao.parentElement.children;

for(let b of botoes){
b.classList.remove("selecionado");
}

botao.classList.add("selecionado");

atualizarStatus();

}


function atualizarStatus(){

let pendencia=false;

for(let item in respostas){

if(respostas[item]=="NÃO CONFORME"){
pendencia=true;
}

}

if(pendencia){

document.getElementById("status").innerHTML="🔴 PENDÊNCIA";
document.getElementById("status").style.background="#f8d7da";
document.getElementById("status").style.color="#721c24";

}else{

document.getElementById("status").innerHTML="🟢 CONFORME";
document.getElementById("status").style.background="#d4edda";
document.getElementById("status").style.color="#155724";

}

}



async function enviarChecklist(){


let locomotiva=document.getElementById("locomotiva").value;

let colaborador=document.getElementById("colaborador").value;


if(!locomotiva){
alert("Informe a locomotiva");
return;
}


if(!colaborador){
alert("Informe o colaborador");
return;
}


itens.forEach(i=>{

if(!respostas[i[0]]){
respostas[i[0]]="CONFORME";
}

});


let dados={

locomotiva,
colaborador,

...respostas,

status:
Object.values(respostas).includes("NÃO CONFORME")
?"PENDÊNCIA":"CONFORME",

observacao:
document.getElementById("observacao").value

};


await fetch(URL_SCRIPT,{
method:"POST",
mode:"no-cors",
body:JSON.stringify(dados)
});


alert("✅ Checklist salvo com sucesso!");


document.getElementById("locomotiva").value="";
document.getElementById("observacao").value="";


respostas={};

carregar();

atualizarStatus();


document.getElementById("locomotiva").focus();

}



function trocarColaborador(){

let nome=prompt("Novo colaborador:");

if(nome){

document.getElementById("colaborador").value=nome;

}

}


carregar();


</script>

</body>
</html>
