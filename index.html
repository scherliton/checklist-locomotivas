<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checklist Locomotivas V2</title>

<style>

body{
    margin:0;
    background:#f1f4f8;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:520px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#003b71;
    margin-bottom:20px;
}

.logo{
    text-align:center;
    font-size:40px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}

input,
textarea,
select{

    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;

}

textarea{
    height:80px;
    resize:none;
}


.item{

    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f7f7f7;
    margin-top:8px;
    padding:10px;
    border-radius:8px;

}


.item select{

    width:120px;
    margin:0;

}


button{

    width:100%;
    margin-top:20px;
    padding:15px;

    background:#0066cc;
    color:white;

    border:none;
    border-radius:10px;

    font-size:18px;
    font-weight:bold;

}


button:disabled{

    background:#888;

}



#popup{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    align-items:center;

    justify-content:center;

}



.popup{

    background:white;

    width:85%;

    max-width:350px;

    padding:25px;

    border-radius:15px;

    text-align:center;

}


.popup h2{

    color:#008000;

}


.id-box{

    margin-top:15px;

    background:#eef6ff;

    padding:12px;

    border-radius:8px;

    font-weight:bold;

}


</style>

</head>


<body>


<div class="container">


<div class="card">


<div class="logo">
🚂
</div>


<h1>
Checklist Locomotivas V2
</h1>



<label>
Locomotiva
</label>


<input 
id="locomotiva"
type="text"
placeholder="Ex: 1304"
autocomplete="off">



<label>
Colaborador
</label>


<input 
id="colaborador"
type="text"
placeholder="Nome do colaborador">



<div id="listaChecklist">



<div class="item">
<span>Papel higiênico</span>

<select class="check">
<option>OK</option>
<option>FALTA</option>
</select>

</div>



<div class="item">
<span>Papel assento</span>

<select class="check">
<option>OK</option>
<option>FALTA</option>
</select>

</div>



<div class="item">
<span>Papel mãos</span>

<select class="check">
<option>OK</option>
<option>FALTA</option>
</select>

</div>



<div class="item">
<span>Detergente</span>

<select class="check">
<option>OK</option>
<option>FALTA</option>
</select>

</div>


<div class="item">
<span>Sabonete</span>

<select class="check">
<option>OK</option>
<option>FALTA</option>
</select>

</div>



<div class="item">
<span>Água</span>

<select class="check">
<option>OK</option>
<option>FALTA</option>
</select>

</div>



<div class="item">
<span>Limpeza cabine</span>

<select class="check">
<option>OK</option>
<option>FALTA</option>
</select>

</div>



<div class="item">
<span>Lixeira</span>

<select class="check">
<option>OK</option>
<option>FALTA</option>
</select>

</div>



<div class="item">
<span>Iluminação</span>

<select class="check">
<option>OK</option>
<option>FALTA</option>
</select>

</div>



<div class="item">
<span>Condição geral</span>

<select class="check">
<option>OK</option>
<option>FALTA</option>
</select>

</div>



</div>



<label>
Observação
</label>


<textarea 
id="observacao"
placeholder="Digite uma observação se necessário">
</textarea>



<button 
id="btnSalvar"
onclick="enviarChecklist()">

SALVAR CHECKLIST

</button>


</div>

</div>


<div id="popup">

<div class="popup">


<h2>
✅ Enviado!
</h2>


<p>
Checklist registrado com sucesso.
</p>


<div class="id-box" id="idGerado">

</div>


<button onclick="fecharPopup()">

OK

</button>


</div>

</div>
<script>


const URL_API = "https://script.google.com/macros/s/AKfycbxxtkYeiuCrzTwasMxoyyAa6dlIPGLiPXhu6nLvMtFaf1GmhGgzSNiHHWnaOfGJVaMzWA/exec";



let enviando = false;



// ===============================
// CARREGAR COLABORADOR MEMORIZADO
// ===============================


window.onload = function(){


    let nomeSalvo = localStorage.getItem("colaborador");


    if(nomeSalvo){

        document
        .getElementById("colaborador")
        .value = nomeSalvo;

    }


    document
    .getElementById("locomotiva")
    .focus();


};




// memorizar colaborador


document
.getElementById("colaborador")
.addEventListener("change",function(){


    localStorage.setItem(
        "colaborador",
        this.value.trim()
    );


});





// ===============================
// GERAR ID
// LOCO1304-20260717-001
// ===============================


function gerarID(){


    let loco =
    document
    .getElementById("locomotiva")
    .value
    .trim();



    let agora = new Date();



    let data =

    agora.getFullYear()

    +

    String(
        agora.getMonth()+1
    )
    .padStart(2,"0")

    +

    String(
        agora.getDate()
    )
    .padStart(2,"0");



    let chave =
    "LOCO_" + loco + "_" + data;



    let seq =
    Number(
        localStorage.getItem(chave) || 0
    ) + 1;



    localStorage.setItem(
        chave,
        seq
    );



    return (

        "LOCO"

        +

        loco

        +

        "-"

        +

        data

        +

        "-"

        +

        String(seq)
        .padStart(3,"0")

    );


}







// ===============================
// ENVIO
// ===============================


async function enviarChecklist(){



    if(enviando){

        return;

    }



    let locomotiva =

    document
    .getElementById("locomotiva")
    .value
    .trim();



    let colaborador =

    document
    .getElementById("colaborador")
    .value
    .trim();





    if(!locomotiva){


        alert(
        "Informe a locomotiva"
        );


        document
        .getElementById("locomotiva")
        .focus();


        return;


    }




    if(!colaborador){


        alert(
        "Informe o colaborador"
        );


        document
        .getElementById("colaborador")
        .focus();


        return;


    }




    enviando = true;



    let botao =
    document
    .getElementById("btnSalvar");



    botao.disabled = true;


    botao.innerHTML =
    "⏳ ENVIANDO...";





    let id = gerarID();



    let campos =

    document
    .querySelectorAll(".check");





    let dados = {


        id:id,


        locomotiva:locomotiva,


        colaborador:colaborador,


        papelHigienico:
        campos[0].value,


        papelAssento:
        campos[1].value,


        papelMaos:
        campos[2].value,


        detergente:
        campos[3].value,


        sabonete:
        campos[4].value,


        agua:
        campos[5].value,


        limpezaCabine:
        campos[6].value,


        lixeira:
        campos[7].value,


        iluminacao:
        campos[8].value,


        condicaoGeral:
        campos[9].value,



        observacao:

        document
        .getElementById("observacao")
        .value,



        dataHora:

        new Date()
        .toLocaleString("pt-BR")


    };





    let temPendencia = false;



    campos.forEach(function(item){


        if(item.value === "FALTA"){


            temPendencia = true;


        }


    });




    dados.status =

    temPendencia ?

    "PENDÊNCIA"

    :

    "OK";







    try{


        let resposta = await fetch(

            URL_API,

            {


                method:"POST",


                headers:{


                    "Content-Type":
                    "text/plain;charset=utf-8"


                },


                body:

                JSON.stringify(dados)


            }


        );





        if(!resposta.ok){


            throw new Error(
            "Falha no envio"
            );


        }





        mostrarPopup(id);





        document
        .getElementById("locomotiva")
        .value="";



        document
        .getElementById("observacao")
        .value="";





    }


    catch(erro){


        alert(
        "Erro ao enviar checklist"
        );


    }


    finally{


        enviando=false;


        botao.disabled=false;


        botao.innerHTML =
        "SALVAR CHECKLIST";


    }



}


// ===============================
// POPUP DE CONFIRMAÇÃO
// ===============================


function mostrarPopup(id){


    document
    .getElementById("idGerado")
    .innerHTML =

    "ID: " + id;



    document
    .getElementById("popup")
    .style.display = "flex";



}



// ===============================
// FECHAR POPUP
// ===============================


function fecharPopup(){


    document
    .getElementById("popup")
    .style.display = "none";



    document
    .getElementById("locomotiva")
    .focus();



}



</script>


</body>

</html>
