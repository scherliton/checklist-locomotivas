<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checklist Locomotivas V2</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
padding:15px;
background:#eef3f8;
}

.app{
max-width:520px;
margin:auto;
}

.header{
background:#003b70;
color:white;
padding:20px;
border-radius:15px 15px 0 0;
text-align:center;
}

.header h1{
margin:0;
font-size:22px;
}

.card{
background:white;
padding:20px;
border-radius:0 0 15px 15px;
box-shadow:0 4px 15px rgba(0,0,0,.15);
}

label{
display:block;
font-weight:bold;
margin-top:15px;
margin-bottom:6px;
}

input,textarea{

width:100%;
padding:13px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;

}

textarea{

height:90px;
resize:none;

}

.btn{

width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;

}

.btn:disabled{

opacity:.6;
cursor:not-allowed;

}

.btn-trocar{

background:#777;
color:white;
margin-top:10px;

}

.item{

margin-top:15px;
padding:15px;
background:#f4f7fa;
border-radius:12px;
border-left:5px solid #003b70;

}

.item-title{

font-weight:bold;
margin-bottom:10px;

}

.botoes{

display:flex;
gap:10px;

}

.botoes button{

flex:1;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;

}

.conforme{

background:#198754;
color:white;

}

.nao{

background:#dc3545;
color:white;

}

.selecionado{

outline:4px solid #003b70;

}

.status{

margin-top:20px;
padding:15px;
border-radius:10px;
text-align:center;
font-size:18px;
font-weight:bold;
background:#d1e7dd;
color:#0f5132;

}

.salvar{

margin-top:20px;
background:#003b70;
color:white;

}


/* popup */

.popup{

display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,.3);
text-align:center;
width:300px;
z-index:999;

}


.popup h2{

color:#198754;

}


.popup button{

padding:12px 25px;
border:none;
border-radius:10px;
background:#003b70;
color:white;
font-weight:bold;

}


.fundo-popup{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.4);
z-index:998;

}


/* OFFLINE / SINCRONIZAÇÃO */

.conexao-box{
margin-top:14px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:10px 12px;
border-radius:10px;
background:#f4f7fa;
font-size:13px;
font-weight:bold;
color:#52606d;
}

.conexao-status{
display:inline-flex;
align-items:center;
gap:7px;
}

.conexao-bolinha{
width:9px;
height:9px;
border-radius:50%;
background:#198754;
}

.conexao-offline .conexao-bolinha{
background:#d97706;
}

.conexao-sync .conexao-bolinha{
background:#0d6efd;
}

.pendentes-badge{
font-weight:normal;
color:#6b7280;
font-size:12px;
}

.btn-sync{
margin-top:10px;
background:#0d6efd;
color:white;
display:none;
}

.popup.offline h2{
color:#d97706;
}

</style>

</head>
<body>


<div class="app">


<div class="header">

<h1>🚂 Checklist Pós-Drenagem</h1>

<div>Locomotivas - V2</div>

</div>


<div class="card">

<div id="conexaoBox" class="conexao-box">

<div class="conexao-status">

<span class="conexao-bolinha"></span>

<span id="textoConexao">🟢 Online</span>

</div>

<div id="pendentesBadge" class="pendentes-badge">

0 pendentes

</div>

</div>


<button
id="btnSincronizar"
class="btn btn-sync"
onclick="sincronizarPendentes()">

🔄 SINCRONIZAR PENDENTES

</button>




<label>Colaborador</label>

<input 
id="colaborador" 
placeholder="Digite o nome do colaborador"
autocomplete="name"
oninput="validarColaborador(this)"
>


<button 
class="btn btn-trocar" 
onclick="trocarColaborador()">

Trocar colaborador

</button>



<label>Locomotiva</label>

<input 
id="locomotiva"
type="number"
inputmode="numeric"
placeholder="Digite o número da locomotiva"
>


<h2>Checklist</h2>


<div id="lista"></div>



<div id="status" class="status">

🟢 CONFORME

</div>



<label>Observação</label>

<textarea 
id="observacao"
placeholder="Digite observações se necessário">
</textarea>



<button 
id="btnSalvar"
class="btn salvar"
onclick="salvarChecklist()">

💾 SALVAR CHECKLIST

</button>



</div>

</div>



<div class="fundo-popup" id="fundoPopup"></div>


<div class="popup" id="popup">

<h2 id="tituloPopup">✅ Enviado!</h2>

<p id="textoPopup"></p>

<button onclick="fecharPopup()">

OK

</button>

</div>
<script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxxtkYeiuCrzTwasMxoyyAa6dlIPGLiPXhu6nLvMtFaf1GmhGgzSNiHHWnaOfGJVaMzWA/exec";


const itens = [

["BanheiroLimpo","🚿 Banheiro limpo"],

["BanheiroDrenado","🚽 Banheiro drenado"],

["DescargaFuncionando","🚽 Descarga funcionando"],

["AguaDisponivel","💧 Água disponível"],

["SaboneteLiquido","🧴 Sabonete líquido"],

["PapelHigienico","🧻 Papel higiênico"],

["PapelToalha","🧻 Papel toalha"],

["Iluminacao","💡 Iluminação"],

["PortaFuncionando","🚪 Porta funcionando"],

["CabineLimpa","🧹 Cabine limpa e organizada"]

];


let respostas = {};

let enviando = false;

const CHAVE_PENDENTES = "checklistPendentesV2";

let sincronizando = false;




function obterPendentes(){

try{

const lista =
JSON.parse(
localStorage.getItem(CHAVE_PENDENTES)
||
"[]"
);

return Array.isArray(lista)
?
lista
:
[];

}
catch(e){

return [];

}

}




function salvarPendentes(lista){

localStorage.setItem(
CHAVE_PENDENTES,
JSON.stringify(lista)
);

atualizarStatusConexao();

}




function adicionarPendente(dados){

const lista =
obterPendentes();


if(
!lista.some(
item => item.id === dados.id
)
){

lista.push({
...dados,
_salvoEm:new Date().toISOString()
});

salvarPendentes(lista);

}

}




function atualizarStatusConexao(){

const box =
document.getElementById("conexaoBox");

const texto =
document.getElementById("textoConexao");

const badge =
document.getElementById("pendentesBadge");

const btn =
document.getElementById("btnSincronizar");


if(
!box
||
!texto
||
!badge
||
!btn
){

return;

}


const pendentes =
obterPendentes();


badge.innerText =

pendentes.length === 1

?

"1 pendente"

:

`${pendentes.length} pendentes`;


box.classList.remove(
"conexao-offline",
"conexao-sync"
);


if(sincronizando){

box.classList.add(
"conexao-sync"
);

texto.innerText =
"🔄 Sincronizando...";

btn.style.display =
"none";

return;

}


if(navigator.onLine){

texto.innerText =
"🟢 Online";

btn.style.display =

pendentes.length > 0

?

"block"

:

"none";

}
else{

box.classList.add(
"conexao-offline"
);

texto.innerText =
"🟠 Offline";

btn.style.display =
"none";

}

}




function limparFormularioDepoisDeSalvar(){

document.getElementById(
"locomotiva"
).value="";


document.getElementById(
"observacao"
).value="";


respostas={};


carregarChecklist();


atualizarStatus();

}




function mostrarPopupOffline(status,id){

const popup =
document.getElementById("popup");

const titulo =
document.getElementById("tituloPopup");


popup.classList.add(
"offline"
);


titulo.innerHTML =
"📱 Salvo no aparelho";


document.getElementById(
"textoPopup"
).innerHTML =

"Sem conexão no momento.<br><br>"

+

"O checklist foi salvo neste aparelho e será sincronizado quando a internet voltar.<br><br>ID:<br><b>"

+

id

+

"</b><br><br>Status:<br><b>"

+

status

+

"</b>";


document.getElementById(
"popup"
).style.display="block";


document.getElementById(
"fundoPopup"
).style.display="block";

}




function mostrarPopupOnline(status,id){

const popup =
document.getElementById("popup");

const titulo =
document.getElementById("tituloPopup");


popup.classList.remove(
"offline"
);


titulo.innerHTML =
"✅ Enviado!";


mostrarPopup(
status,
id
);

}




async function enviarRegistro(dados){

await fetch(
URL_SCRIPT,
{
method:"POST",
mode:"no-cors",
body:JSON.stringify(dados)
}
);

}




async function sincronizarPendentes(){

if(
sincronizando
||
!navigator.onLine
){

return;

}


const lista =
obterPendentes();


if(
lista.length === 0
){

atualizarStatusConexao();

return;

}


sincronizando=true;

atualizarStatusConexao();


const restantes=[];


for(
const item
of lista
){

try{

const dadosEnvio={
...item
};


delete dadosEnvio._salvoEm;


await enviarRegistro(
dadosEnvio
);

}
catch(e){

restantes.push(
item
);

}

}


salvarPendentes(
restantes
);


sincronizando=false;


atualizarStatusConexao();


if(
restantes.length === 0
){

alert(
"✅ Registros pendentes sincronizados com sucesso!"
);

}

}




window.addEventListener(
"online",
()=>{

atualizarStatusConexao();

setTimeout(
()=>{

sincronizarPendentes();

},
700
);

}
);




window.addEventListener(
"offline",
()=>{

atualizarStatusConexao();

}
);



function validarColaborador(campo){

campo.value = campo.value.replace(/[^a-zA-ZÀ-ÿ\s]/g,"");

salvarMemoriaColaborador();

}




function salvarMemoriaColaborador(){

let nome = document.getElementById("colaborador").value.trim();

if(nome){

localStorage.setItem("colaborador",nome);

}

}




function carregarColaborador(){

let nome = localStorage.getItem("colaborador");

if(nome){

document.getElementById("colaborador").value = nome;

}

}




function trocarColaborador(){

let nome = prompt("Digite o novo colaborador");


if(nome){

nome = nome.replace(/[^a-zA-ZÀ-ÿ\s]/g,"").trim();


if(nome){

document.getElementById("colaborador").value = nome;

localStorage.setItem("colaborador",nome);

}

}


}




function carregarChecklist(){

let html="";


itens.forEach(item=>{


html += `

<div class="item">

<div class="item-title">

${item[1]}

</div>


<div class="botoes">


<button class="conforme"

onclick="marcar('${item[0]}','CONFORME',this)">

✅ CONFORME

</button>


<button class="nao"

onclick="marcar('${item[0]}','NÃO CONFORME',this)">

❌ NÃO CONFORME

</button>


</div>

</div>

`;

});


document.getElementById("lista").innerHTML = html;


}



function marcar(campo,valor,botao){


respostas[campo]=valor;


let botoes=botao.parentElement.children;


for(let b of botoes){

b.classList.remove("selecionado");

}


botao.classList.add("selecionado");


atualizarStatus();


}




function atualizarStatus(){


let pendencia = Object.values(respostas)
.includes("NÃO CONFORME");


let status=document.getElementById("status");



if(pendencia){

status.innerHTML="🔴 PENDÊNCIA";

status.style.background="#f8d7da";

status.style.color="#842029";


}else{


status.innerHTML="🟢 CONFORME";

status.style.background="#d1e7dd";

status.style.color="#0f5132";


}


}
function gerarID(){

let loco = document
.getElementById("locomotiva")
.value
.trim();


let agora = new Date();


let data =

agora.getFullYear()

+

String(agora.getMonth()+1)
.padStart(2,"0")

+

String(agora.getDate())
.padStart(2,"0");



let chave = "ID_"+loco+"_"+data;


let numero = Number(localStorage.getItem(chave) || 0) + 1;


localStorage.setItem(chave,numero);



return "LOCO"
+
loco
+
"-"
+
data
+
"-"
+
String(numero).padStart(3,"0");


}




function mostrarPopup(status,id){


document.getElementById("textoPopup").innerHTML =

"Checklist salvo com sucesso!<br><br>ID:<br><b>"

+

id

+

"</b><br><br>Status:<br><b>"

+

status

+

"</b>";



document.getElementById("popup").style.display="block";

document.getElementById("fundoPopup").style.display="block";


}





function fecharPopup(){


document.getElementById("popup").style.display="none";


document.getElementById("fundoPopup").style.display="none";


document.getElementById("locomotiva").focus();


}





async function salvarChecklist(){


if(enviando){

return;

}



let botao =
document.getElementById("btnSalvar");



let locomotiva =
document.getElementById("locomotiva").value.trim();



let colaborador =
document.getElementById("colaborador").value.trim();





if(!locomotiva){

alert("Informe a locomotiva");

return;

}



if(!/^[0-9]+$/.test(locomotiva)){

alert("A locomotiva deve conter somente números");

return;

}




if(!colaborador){

alert("Informe o colaborador");

return;

}



if(!/^[A-Za-zÀ-ÿ\s]+$/.test(colaborador)){

alert("O colaborador deve conter somente texto");

return;

}





enviando=true;


botao.disabled=true;


botao.innerHTML =

navigator.onLine

?

"⏳ ENVIANDO..."

:

"💾 SALVANDO NO APARELHO...";



itens.forEach(item=>{


if(!respostas[item[0]]){


respostas[item[0]]="CONFORME";


}


});






let status =

Object.values(respostas)
.includes("NÃO CONFORME")

?

"PENDÊNCIA"

:

"CONFORME";






let idRegistro =
gerarID();






let dados={


id:idRegistro,


locomotiva:locomotiva,


colaborador:colaborador,


...respostas,


status:status,


observacao:
document.getElementById("observacao").value


};





try{


if(!navigator.onLine){


adicionarPendente(
dados
);


mostrarPopupOffline(
status,
idRegistro
);


limparFormularioDepoisDeSalvar();


return;


}




try{


await enviarRegistro(
dados
);


mostrarPopupOnline(
status,
idRegistro
);


limparFormularioDepoisDeSalvar();


}
catch(e){


adicionarPendente(
dados
);


mostrarPopupOffline(
status,
idRegistro
);


limparFormularioDepoisDeSalvar();


}


}
finally{


enviando=false;


botao.disabled=false;


botao.innerHTML =
"💾 SALVAR CHECKLIST";


atualizarStatusConexao();


}



}



carregarChecklist();

carregarColaborador();


atualizarStatusConexao();


if(navigator.onLine){

setTimeout(
()=>{

sincronizarPendentes();

},
1000
);

}


</script>



<script>

if(
"serviceWorker"
in navigator
){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("./service-worker.js")
.catch(
err =>
console.error(
"Service Worker:",
err
)
);

}
);

}

</script>

</body>

</html>
