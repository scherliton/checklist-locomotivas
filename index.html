<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checklist Locomotivas V2</title>

<style>

*{
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
margin:0;
padding:15px;
background:#eef3f8;
}

.app{
max-width:520px;
margin:auto;
}

.header{
background:#003b70;
color:white;
padding:20px;
border-radius:15px 15px 0 0;
text-align:center;
}

.header h1{
margin:0;
font-size:22px;
}

.card{
background:white;
padding:20px;
border-radius:0 0 15px 15px;
box-shadow:0 4px 15px rgba(0,0,0,.15);
}

label{
display:block;
font-weight:bold;
margin-top:15px;
margin-bottom:6px;
}

input, textarea{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

textarea{
height:90px;
resize:none;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.btn-trocar{
background:#777;
color:white;
margin-top:10px;
}

.item{
margin-top:15px;
padding:15px;
background:#f4f7fa;
border-radius:12px;
border-left:5px solid #003b70;
}

.item-title{
font-weight:bold;
margin-bottom:10px;
}

.botoes{
display:flex;
gap:10px;
}

.botoes button{
flex:1;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.conforme{
background:#198754;
color:white;
}

.nao{
background:#dc3545;
color:white;
}

.selecionado{
outline:4px solid #003b70;
}

.status{
margin-top:20px;
padding:15px;
border-radius:10px;
text-align:center;
font-size:18px;
font-weight:bold;
background:#d1e7dd;
color:#0f5132;
}

.salvar{
margin-top:20px;
background:#003b70;
color:white;
}


/* POPUP */

.popup{

display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 5px 25px rgba(0,0,0,.3);

text-align:center;

width:300px;

z-index:999;

}


.popup h2{

color:#198754;

}


.popup button{

padding:12px 25px;

border:none;

border-radius:10px;

background:#003b70;

color:white;

font-weight:bold;

}


.fundo-popup{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.4);

z-index:998;

}


</style>

</head> 
  <body>


<div class="app">


<div class="header">

<h1>🚂 Checklist Pós-Drenagem</h1>

<div>Locomotivas - V2</div>

</div>


<div class="card">


<label>Colaborador</label>

<input id="colaborador" placeholder="Digite seu nome">


<button class="btn btn-trocar" onclick="trocarColaborador()">

Trocar colaborador

</button>



<label>Locomotiva</label>

<input id="locomotiva" placeholder="Digite a locomotiva">



<h2>Checklist</h2>


<div id="lista"></div>



<div id="status" class="status">

🟢 CONFORME

</div>



<label>Observação</label>

<textarea id="observacao" placeholder="Digite observações se necessário"></textarea>



<button class="btn salvar" onclick="salvarChecklist()">

💾 SALVAR CHECKLIST

</button>



</div>

</div>



<!-- POPUP -->

<div class="fundo-popup" id="fundoPopup"></div>


<div class="popup" id="popup">


<h2>✅ Enviado!</h2>


<p id="textoPopup"></p>


<button onclick="fecharPopup()">

OK

</button>


</div> 
<script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxxtkYeiuCrzTwasMxoyyAa6dlIPGLiPXhu6nLvMtFaf1GmhGgzSNiHHWnaOfGJVaMzWA/exec";


const itens = [

["BanheiroLimpo","🚿 Banheiro limpo"],

["BanheiroDrenado","🚽 Banheiro drenado"],

["DescargaFuncionando","🚽 Descarga funcionando"],

["AguaDisponivel","💧 Água disponível"],

["SaboneteLiquido","🧴 Sabonete líquido"],

["PapelHigienico","🧻 Papel higiênico"],

["PapelToalha","🧻 Papel toalha"],

["Iluminacao","💡 Iluminação"],

["PortaFuncionando","🚪 Porta funcionando"],

["CabineLimpa","🧹 Cabine limpa e organizada"]

];


let respostas = {};



function carregarChecklist(){

let html="";


itens.forEach(item=>{


html += `

<div class="item">

<div class="item-title">
${item[1]}
</div>


<div class="botoes">


<button class="conforme"
onclick="marcar('${item[0]}','CONFORME',this)">

✅ CONFORME

</button>


<button class="nao"
onclick="marcar('${item[0]}','NÃO CONFORME',this)">

❌ NÃO CONFORME

</button>


</div>

</div>

`;

});


document.getElementById("lista").innerHTML = html;

}




function marcar(campo,valor,botao){


respostas[campo]=valor;


let botoes = botao.parentElement.children;


for(let b of botoes){

b.classList.remove("selecionado");

}


botao.classList.add("selecionado");


atualizarStatus();

}




function atualizarStatus(){


let pendencia =
Object.values(respostas)
.includes("NÃO CONFORME");


let status =
document.getElementById("status");



if(pendencia){


status.innerHTML="🔴 PENDÊNCIA";

status.style.background="#f8d7da";

status.style.color="#842029";


}else{


status.innerHTML="🟢 CONFORME";

status.style.background="#d1e7dd";

status.style.color="#0f5132";


}


}




function gerarID(){


let data=new Date();


return "CHK-"+
data.getFullYear()+
(data.getMonth()+1).toString().padStart(2,"0")+
data.getDate().toString().padStart(2,"0")+
"-"+
Date.now();


}





function trocarColaborador(){


let nome = prompt("Digite o novo colaborador");


if(nome){


document.getElementById("colaborador").value=nome;


localStorage.setItem("colaborador",nome);


}


}




function carregarColaborador(){


let nome =
localStorage.getItem("colaborador");


if(nome){

document.getElementById("colaborador").value=nome;

}


}





function mostrarPopup(status){


document.getElementById("textoPopup").innerHTML =

"Checklist salvo com sucesso!<br><br>Status:<br><b>"
+
status+
"</b>";



document.getElementById("popup").style.display="block";


document.getElementById("fundoPopup").style.display="block";


}





function fecharPopup(){


document.getElementById("popup").style.display="none";


document.getElementById("fundoPopup").style.display="none";


// volta para locomotiva

document.getElementById("locomotiva").focus();


}





async function salvarChecklist(){


let locomotiva =
document.getElementById("locomotiva").value;


let colaborador =
document.getElementById("colaborador").value;



if(!locomotiva){

alert("Informe a locomotiva");

return;

}



if(!colaborador){

alert("Informe o colaborador");

return;

}




itens.forEach(item=>{


if(!respostas[item[0]]){

respostas[item[0]]="CONFORME";

}


});




let status =

Object.values(respostas)
.includes("NÃO CONFORME")

?

"PENDÊNCIA"

:

"CONFORME";






let dados={


id:gerarID(),

locomotiva:locomotiva,

colaborador:colaborador,


...respostas,


status:status,


observacao:
document.getElementById("observacao").value


};





await fetch(URL_SCRIPT,{

method:"POST",

mode:"no-cors",

body:JSON.stringify(dados)

});





mostrarPopup(status);





document.getElementById("locomotiva").value="";


document.getElementById("observacao").value="";


respostas={};


carregarChecklist();


atualizarStatus();



}





carregarChecklist();

carregarColaborador();



</script>


</body>

</html>
